# This project's own analysis parameters (as opposed to config/datasets.yaml,
# which only points at where upstream data lives). Populated incrementally as
# each analysis stage is migrated — see design doc §9.

# --- Gene feature collection (1b_features.smk) ---
features:
  # Which source feeds the `paralog_count` column of the feature matrix.
  #   deletion_library : the Hayles-2013 `Paralogues` column (curated within-species
  #                      paralogues), read as the long table built by the
  #                      build_deletion_library_paralogs rule. Covers only the 4,843
  #                      genes of that deletion library, so the 287 coding genes
  #                      outside it read 0.
  #   ensembl          : the BioMart paralog export. All genes, but 7,908 of its
  #                      10,888 paralogue rows are `other_paralog`, i.e. a homolog
  #                      whose last common ancestor with S. pombe is Fungi or above
  #                      — 1,013 genes get a count on that basis alone. It also caps
  #                      at 24 paralogues per gene, which 25 genes hit.
  # The two agree on 1,410 pairs; Hayles is a subset of Ensembl for 898/955 genes.
  # Switching this re-runs only collect_evolutionary_features and its downstream
  # (merge -> the feature matrix -> ml); the source is echoed into the shell
  # command, so Snakemake picks the change up on its own.
  paralog_source: deletion_library

# --- Gene-level clustering (clustering.smk) ---
clustering:
  random_state: 42      # seed for KMeans / GMM (also KMeans n_init=10)
  k_min: 2              # k-sweep lower bound (evaluate_cluster_numbers, diagnostic)
  k_max: 20             # k-sweep upper bound
  dr_clamp: -1.3        # DR below this is clamped to this value (byte-faithful quirk;
                        # a floor, not a cap — upstream flipped the DR sign 2026-09-17,
                        # negative DR is now the depleted end)
  dl_divisor: 10        # DL is divided by this before clustering
  final_n_clusters: 9   # final cluster count k for EVERY variant (WT = enrichment.wt_cluster)
  # --- Finalize variants (design doc 2026-07-21-clustering-finalize-variants) ---
  # Each named variant is one finalize strategy; enrichment.smk fans out over ALL
  # of them (compare), ml.smk uses only `selected_variant`. Every variant emits the
  # unified `cluster` column (1..final_n_clusters, WT = enrichment.wt_cluster);
  # auto_merge/manual_merge also keep a `raw_cluster` column. Fields per `type`:
  #   direct       {method}                  -> cluster straight to final_n_clusters, DR-numbered
  #   auto_merge   {method, n_intermediate}  -> cluster to n_intermediate, ward-merge centroids -> final_n_clusters
  #   grid         {dr_cuts, dl_cuts}        -> axis-cut grid (cell count must == final_n_clusters)
  #   manual_merge {method, n_intermediate}  -> cluster to n_intermediate, hand-tuned merge (finalize_gene_clusters.ipynb, run headlessly by finalize_manual_merge)
  # grid cuts are thresholds in SCALED space (DR clamped, DL divided); DR cuts are
  # negative because the depleted end is now the low end (sign flipped 2026-09-17).
  variants:
    kmeans_direct9:       {type: direct,       method: kmeans}
    kmeans_merge9_auto:   {type: auto_merge,   method: kmeans,           n_intermediate: 64}
    kmeans_merge9_manual: {type: manual_merge, method: kmeans,           n_intermediate: 64}
    hc_direct9:           {type: direct,       method: hierarchical_agg}
    hc_merge9_auto:       {type: auto_merge,   method: hierarchical_agg, n_intermediate: 64}
    gmm_direct9:          {type: direct,       method: gmm}
    gmm_merge9_auto:      {type: auto_merge,   method: gmm,              n_intermediate: 64}
    grid9:                {type: grid,         dr_cuts: [-0.8, -0.4], dl_cuts: [0.05, 0.3]}
  selected_variant: kmeans_direct9   # variant ml.smk reads (equiv. old finalize_mode: auto)
  selected_variant_overrides: {}     # per-dataset override, e.g. {HD_DIT_HAP: kmeans_merge9_manual}

# --- Ontology enrichment (enrichment.smk) ---
enrichment:
  fdr_threshold: 0.05   # alpha for goatools FDR-BH
  wt_cluster: 9         # WT/background cluster id; clusters < this get nonWT comparison
  pop_count_max: 400    # max pop_count for the filtered GO output

# --- Network enrichment: STRING + REVIGO (enrichment_network.smk) ---
enrichment_network:
  revigo_cutoffs: [0.7, 0.5]   # REVIGO semantic-similarity cutoffs, run in order (loose then tight)

# --- PCR / library-prep quality control (1a_pcr_qc.smk) ---
# Which specific libraries to compare in the 2x2 QC figure. These read upstream
# pre-release merged reads (results/8_merged/...) via data_config.merged_reads_path(),
# so every dataset named here must declare `results_dir` in datasets.yaml.
pcr_qc:
  # Panel (a): PBL vs PBR primer reads of one library.
  pbl_pbr:
    dataset: LD_DIT_HAP
    sample: LD1328-7
    timepoint: 0h
    condition: "YES"      # quoted: bare YES is a YAML 1.1 boolean (true)
  # Panel (b): technical replicate — same sample processed in two upstream projects (compare Reads).
  technical_replicate:
    dataset_1: LD_DIT_HAP
    dataset_2: Spore2YES6_1328
    sample: LD1328-7
    timepoint: 0h
    condition: "YES"
  # Panel (c): biological replicate — two samples in one project (compare Reads).
  biological_replicate:
    dataset: LD_DIT_HAP
    sample_1: LD1328-4
    sample_2: LD1328-8
    timepoint: 0h
    condition: "YES"

# --- Spike-in dilution linearity QC (1a_pcr_qc.smk) ---
# 5 known spike-in insertion coordinates in the Spikein calibration project;
# reads at each site are ranked and matched against a known dilution series.
spikein:
  coordinates:
    DY215: {chr: "I",  coord: 3749394, strand: "-"}
    DY217: {chr: "II", coord: 3344505, strand: "-"}
    DY218: {chr: "II", coord: 185161,  strand: "-"}
    DY339: {chr: "II", coord: 1157130, strand: "-"}
    DY348: {chr: "II", coord: 3065244, strand: "-"}

# --- Machine learning (ml.smk) ---
ml:
  dr_split_threshold: -0.35  # DR < / >= this defines the DR_lt_p35 / DR_ge_p35 splits
  wt_cluster: 9              # DIT_HAP_cluster != this defines the nonWT split
  dr_filter: -0.3            # AutoML modeling filter: keep genes with DR < this (train_automl)
  test_size: 0.2             # AutoML train/test split fraction
  random_state: 42           # AutoML split + mljar seed (reproducibility)
  total_time_limit: 14400    # mljar budget (s); large so full algorithm list always finishes

# --- Large-scale study comparison (comparison.smk) ---
# Batch B: correlates the curated DIT-HAP fitness metric against the gRNA HD-data
# fit + the PomBase protein-features study columns (Barseq, integration density,
# colony size, ...). Both the gRNA file and final_clusters.tsv are curated inputs.
comparison:
  gRNA_data_file: "resources/curated/260127-all_genes_order1_gRNA_HDdata_fitted_parameters.tsv"
  clip_upper: 200            # cap for integration-density columns (byte-faithful to notebook)

# --- Coherence of gene groups in DR-DL fitness space (3a_coherence.smk) ---
# Per (dataset x source): for every group (GO complex / CC / BP term) whose
# DR<dr_threshold members (negative DR = depleted, sign flipped 2026-09-17) number
# min..max AND whose total annotated size is
# <= max_term_genes, measure how tightly they cluster in normalized (DR, DL/10)
# space vs a seeded permutation null (median pairwise distance z-score). Fans out
# by `source`; add a database = add a loader in workflow/src/coherence/sources.py
# + a name here. scatter_groups drives plot_group_scatter (per-source namelist,
# entries match group_name OR group_id).
coherence:
  # Grouping databases to run the coherence chain over. go_* read PomBase; kegg_*
  # read the kegg_parser derived tables under kegg_dir and resolve KEGG gene
  # symbols to PomBase systematic ids so they land in the same gene space.
  # kegg_brite groups by each gene's deepest BRITE classification node (one group
  # per tree, so an ancestor and its descendants never both appear).
  sources: [go_macrocomplex, go_cc, go_bp, kegg_brite, kegg_pathway]
  kegg_dir: resources/external/kegg/data/derived
  min_group_size: 3
  max_group_size: 300
  max_term_genes: 350
  dr_threshold: -0.3
  n_permutations: 1000
  random_state: 42
  features_panels: true            # add the abundance/conservation uniformity columns
  # Cohort definitions — the two ends of the z-score axis (median_pairwise_distance).
  #   coherent   = q_value <= coherent_q_max (BH, per source) AND z < coherent_z_threshold
  #   incoherent = z > incoherent_z_threshold alone
  # The incoherent end carries no FDR by construction: the coherence test is one-sided
  # for tightness, so every dispersed group has q near 1 and significance cannot select
  # that end. It is therefore a descriptive cut, while the coherent end is error-controlled.
  coherent_q_max: 0.05
  coherent_z_threshold: -2.0
  # Loosened from 1.0 to 0.5 (2026-09-29). Reads as: this end is a descriptive rank
  # cut on the same permutation z (no FDR, see above), so 0.5 admits ~15% of the
  # terms as "incoherent" — it selects a ranked tail, not evidence of dispersion.
  # It also sets is_incoherent for the attribution stage and the FDR panel's label
  # band; the top-N attribution panels still take the most dispersed groups first.
  incoherent_z_threshold: 0.5
  # FDR-vs-coherence panel: which groups get named. The coherent end draws on the
  # coherent cohort above; the top `fdr_panel_label_quantile` share of each end is
  # named, capped at `fdr_panel_label_max` per side.
  fdr_panel_label_quantile: 0.05
  fdr_panel_label_max: 5
  scatter_groups:
    go_macrocomplex: [kinetochore, "mitochondrial large ribosomal subunit"]
    go_cc: []
    go_bp: []
    kegg_brite: []
    kegg_pathway: []
  # Redundancy reduction (display layer; full-set q_value is untouched). Terms are
  # clustered by member-gene similarity (+ optional GO DAG lineage), one
  # representative kept per cluster; the full cluster is retained + flagged.
  # Jaccard |A∩B|/|A∪B|, NOT the overlap coefficient |A∩B|/min(|A|,|B|): with min()
  # any term contained in a larger one scores 1.0, and since GO propagation makes
  # containment ubiquitous the redundancy graph became one blob (2,097 terms -> 2
  # clusters). Raised from 0.5 to 0.7 (2026-09-29) to collapse less aggressively:
  # at 0.5 complete linkage still fused 26-term clusters of merely co-annotated
  # GO BP terms, which is co-membership rather than the same signal.
  dedup_jaccard_threshold: 0.7
  # How the "these two clear the threshold" relation is turned into clusters.
  # `complete` (agglomerative, cut at 1 - threshold) instead of `single`
  # (connected components): single linkage is transitive, so A~B and B~C fuse A and
  # C even at Jaccard 0 and a cluster ends up only as tight as its weakest link.
  # Measured on the 2,587-term table, single @0.5 gave 37.5% of intra-cluster pairs
  # sharing no member and a 193-term biggest cluster (union: 191 genes, cytosolic
  # and mitochondrial ribosomes together); complete @0.5 caps it at 26 and puts the
  # two ribosomes in separate clusters. `average` is available as the middle ground.
  dedup_linkage: complete
  # OFF by default. The lineage rule unites any member-sharing ancestor/descendant
  # pair, and GO propagation guarantees every term shares members with all of its
  # ancestors, so transitivity chains the entire DAG into one cluster: with it on,
  # 2,046 of 2,097 terms land in a single cluster and the similarity threshold
  # stops mattering (0.5 -> 0.9 moves the max cluster 2046 -> 1966). It looked
  # harmless under the old overlap coefficient only because that metric had
  # already merged every nested pair first. Turn it back on only alongside a
  # rule that merges single parent/child steps rather than the whole ancestor set.
  dedup_merge_dag_lineage: false
  dedup_scope: pooled               # "pooled" (collapse across sources) | "per_source"
  dedup_force_representatives: []    # group_ids you hand-pick as their cluster's representative
  # Incoherence attribution: diagnose WHY a group is dispersed (major/minor split,
  # shared subunits, paralog buffering, ...). Runs on every source: the split /
  # shared-subunit signals are strongest for physical complexes (go_macrocomplex),
  # but for the process / pathway sources they still discriminate a genuinely
  # two-population term from one that is just broadly annotated.
  attribution_sources: [go_macrocomplex, go_cc, go_bp, kegg_brite, kegg_pathway]
  attribution_top_n_plot: 16         # how many top-incoherent complexes to scatter
  attribution_shared_frac_threshold: 0.5   # frac_shared_members >= this -> shared-subunit label
  attribution_paralog_frac_threshold: 0.5  # paralog_fraction >= this -> paralog-buffered label

# --- Per-gene annotation reference + annotated tables (1c_annotate.smk) ---
annotate:
  # SGD snapshot to build the reference against. This is a data-source VERSION,
  # pinned here rather than auto-detected from resources/external/sgd/: picking
  # "the newest directory" would silently change the annotation the next time
  # anyone fetches SGD. Bump it deliberately, alongside a fetch_sgd_data run.
  sgd_version: "2026-08-11"
  # Tables to annotate via `rule annotate_table` (a named-target registry, so a
  # one-off join is a config entry rather than a hand-typed command). Each entry:
  #   input:       path to the table (tsv/csv/xlsx); {dataset} is substituted
  #   gene_column: column holding pombe systematic IDs
  #   columns:     optional subset of annotation columns (omit = all 24)
  #   drop_unmatched: optional, default false (keep unmatched rows, empty annotation)
  # Output lands at results/1c_annotation/{dataset}/tables/{name}.annotated.tsv
  tables:
    final_clusters:
      input: "results/clustering/{dataset}/{variant}/final_clusters.tsv"
      gene_column: "Systematic ID"
