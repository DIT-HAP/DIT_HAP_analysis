# Dataset registry — points at DIT_HAP_snakemake's packaged release/ dirs.
# See docs/plans/2026-07-15-DIT-HAP-analysis-design.md §3.
default_dataset: HD_DIT_HAP

snakemake_repo: /data/c/yangyusheng_optimized/DIT_HAP_snakemake

reference:
  pombase_version: "2026-06-01"
  # AlphaFold structures are too large to copy locally (design doc §4) — referenced
  # by absolute external path instead of a resources/ copy.
  alphafold_dir: /hugedata/YushengYang/AFdb/UP000002485_284812_SCHPO_v6
  # Canonical copy lives in DIT_HAP_snakemake; this repo keeps a committed copy so
  # the features stage builds without the upstream checkout. Both must hash to
  # sha256 (tests/test_data_config.py enforces it). Update the copy and the pin in
  # the same commit when upstream replaces the file.
  deletion_library:
    local: resources/curated/deletion_library_categories.xlsx
    upstream: resources/Literature/Hayles_2013_OB_merged_categories.xlsx
    sha256: "b9549a0a1d000a9af292ed2fb7a30a2a26b84ea9ec5535974c32e84fecddfec3"

datasets:
  LD_DIT_HAP:
    label: "LD DIT-HAP"
    release_dir: projects/LD_DIT_HAP/release
    # pre-release intermediate results/ (NOT the release contract) — only PCR QC
    # reads these merged PBL/PBR tables; see data_config.merged_reads_path().
    # Relative to snakemake_repo (consistent with release_dir).
    results_dir: projects/LD_DIT_HAP/results
    has_time_points: true
    has_imputation: true   # release/ populated on disk
  HD_DIT_HAP:
    label: "HD DIT-HAP"
    release_dir: projects/HD_DIT_HAP/release
    has_time_points: true
    has_imputation: true
  HD_diploid:
    label: "HD diploid"
    release_dir: projects/HD_diploid/release
    has_time_points: true
    has_imputation: false
  LD_haploid:
    label: "LD haploid"
    release_dir: projects/LD_haploid/release
    has_time_points: true
    has_imputation: false   # release/ populated on disk
  Spikein:
    label: "Spike-in calibration"
    release_dir: projects/Spikein/release
    # pre-release intermediate results/ (NOT the release contract) — 1a_pcr_qc.smk
    # reads the filtered raw-reads table from here; release/ never packages it
    # (see DIT_HAP_snakemake's packaging.smk RELEASE_MAP). Relative to
    # snakemake_repo (consistent with release_dir), same EXCEPTION as 1a_pcr_qc.smk.
    results_dir: projects/Spikein/results
    has_time_points: false
    has_imputation: false   # release/ populated on disk
  Spore2YES6_1328:
    label: "Spore-to-YES6 1328"
    release_dir: projects/Spore2YES6_1328/release
    # pre-release intermediate results/ (NOT the release contract) — only PCR QC
    # reads these merged PBL/PBR tables; see data_config.merged_reads_path().
    # Relative to snakemake_repo (consistent with release_dir).
    results_dir: projects/Spore2YES6_1328/results
    has_time_points: true
    has_imputation: false   # release/ populated on disk


