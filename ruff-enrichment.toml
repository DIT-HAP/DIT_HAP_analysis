# Strict lint + format rules for the enrichment stage.
#
# This file is NOT auto-discovered (only pyproject.toml / ruff.toml /
# .ruff.toml are): each enrichment directory has a .ruff.toml that extends it.
# The workspace Stop hook runs `ruff check --fix .` over the whole repo, so the
# rules must not live at the project root or they would rewrite every stage.
target-version = "py312"
line-length = 100
src = ["workflow/src", "workflow/scripts"]
unsafe-fixes = false

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[lint]
# Explicitly enabled rule prefixes and individual rule codes (uncomment any line to activate)
select = [
    # -------------------------------------------------------------------------
    # [Category A] Core Syntax, Logic Bugs & High-Risk Footguns (Enabled)
    # -------------------------------------------------------------------------
    "F",        # [Pyflakes] Core logic errors: unused imports (F401), undefined names (F821), unused locals (F841), placeholder-free f-strings (F541)
    "E",        # [pycodestyle Error] PEP 8 structural errors: imports not at top of file (E402), == None comparisons (E711), bare except: blocks (E722)
    "W",        # [pycodestyle Warning] PEP 8 formatting warnings: trailing whitespace (W291), missing newline at EOF (W292), invalid escape sequences (W605)
    "B",        # [flake8-bugbear] High-risk design flaws: mutable default args def f(x=[]) (B006), zip() without strict= (B905), loop var leaks (B007)
    "A",        # [flake8-builtins] Built-in shadowing protection: prevents naming variables or arguments id, list, dict, type, max, min, or input
    "YTT",      # [flake8-2020] Prevents brittle sys.version[:3] slicing checks that break on two-digit minor versions like Python 3.10+

    # -------------------------------------------------------------------------
    # [Category B] Modern Python 3.12+ Syntax & Type Annotations
    # -------------------------------------------------------------------------
    "UP",       # [pyupgrade] Enforce modern syntax: X | Y unions (UP007), built-in generics (UP006), f-strings over .format() (UP032) and % (UP031)
    "ANN",      # [flake8-annotations] Require explicit type annotations on all function parameters (ANN001) and return values (ANN201/ANN202)
    # "SLOT",   # [flake8-slots] Disabled: enforcing __slots__ on subclasses adds unnecessary friction in scientific analysis scripts
    # "FA",     # [flake8-future-annotations] Check from __future__ import annotations (unnecessary with native Python 3.12+ typing)
    # "TC",     # [flake8-type-checking] Force moving type-only imports into if TYPE_CHECKING: blocks (adds boilerplate to standalone scripts)
    # "PYI",    # [flake8-pyi] Style rules dedicated to .pyi stub files (irrelevant for standard .py analysis workflows)

    # -------------------------------------------------------------------------
    # [Category C] Control Flow Simplification, Complexity & Anti-Bloat
    # -------------------------------------------------------------------------
    "C90",      # [mccabe] Cyclomatic complexity gate (C901): blocks deeply nested defensive if-else and try-except trees written by AI agents
    "SIM",      # [flake8-simplify] Simplify redundant control flow: merge nested ifs (SIM102), simplify if c: return True else: return False (SIM103), prefer dict.get() (SIM401)
    "RET",      # [flake8-return] Clean return paths: flag unnecessary else after return (RET505) and useless temporary variables right before return (RET504)
    "PIE",      # [flake8-pie] Eliminate boilerplate: remove unnecessary pass (PIE790), flag duplicate StrEnum values (PIE796), combine startswith calls (PIE810)
    "C4",       # [flake8-comprehensions] Simplify comprehensions: rewrite list([x for x in y]) to [x for x in y] (C411) and dict([(k, v) ...]) to {k: v ...} (C402)
    "FURB",     # [refurb] Modernize stdlib usage: e.g., replace verbose with open(p) as f: f.read() blocks with p.read_text() (FURB101)
    "ARG",      # [flake8-unused-arguments] Flag unused function arguments (ARG001/ARG002) frequently left behind when AI agents refactor function bodies
    # "FBT",    # [flake8-boolean-trap] Forbid positional boolean arguments (too noisy for small helper functions when configs already use dataclass(kw_only=True))

    # -------------------------------------------------------------------------
    # [Category D] Pylint Rules (Granular Selection for Scientific Code)
    # -------------------------------------------------------------------------
    "PLE",      # [Pylint Error] Definite runtime errors: e.g., invalid string format arguments, returning non-None from __init__, inheriting from non-classes
    "PLC0415",  # [Pylint Convention - Single Rule] Strictly forbid import statements inside function/class bodies; all imports must live in top-level IMPORTS section
    "PLR09",    # [Pylint Refactor - Size Limits] Structural size limits: max arguments (PLR0913), max branches (PLR0912), max returns (PLR0911), max statements (PLR0915)
    # "PLC",    # [Pylint Convention - Full] Contains noisy micro-rules beyond PLC0415; keep disabled
    # "PLR",    # [Pylint Refactor - Full] Kept disabled because it includes PLR2004 (magic-value-comparison), which flags numeric thresholds like df[col] < 0.05
    # "PLW",    # [Pylint Warning - Full] Overlaps heavily with Pyflakes/Bugbear and includes overly strict warnings against reassigning loop variables (PLW2901)

    # -------------------------------------------------------------------------
    # [Category E] Import Ordering, Pathlib & Architecture Discipline
    # -------------------------------------------------------------------------
    "I",        # [isort] Enforce deterministic import grouping (1. Stdlib -> 2. Third-party -> 3. Project modules) and alphabetical sorting (I001)
    "PTH",      # [flake8-use-pathlib] Ban os.path.* and built-in open(); enforce pathlib.Path everywhere
    "ICN",      # [flake8-import-conventions] Enforce standard scientific aliases (import pandas as pd, import numpy as np) and forbid non-standard aliases (ICN001)
    "TID251",   # [flake8-tidy-imports - Single Rule] Activate custom banned-api rules configured below (e.g., hard ban on stdlib logging)
    # "TID",    # [flake8-tidy-imports - Full] Includes TID252 which bans relative imports (from . import mod), which may be required inside src/ modules
    # "INP",    # [flake8-no-pep420] Require __init__.py in all directories (inappropriate for standalone scripts/ folders)
    # "EXE",    # [flake8-executable] Check shebang and executable permissions (prone to false positives across platforms)

    # -------------------------------------------------------------------------
    # [Category F] Exception Handling & Logging Discipline
    # -------------------------------------------------------------------------
    "T20",      # [flake8-print] Ban print() (T201) and pprint() (T203) calls across the codebase; enforce loguru.logger exclusively
    "BLE",      # [flake8-blind-except] Ban blind except Exception: or except BaseException: blocks that swallow errors silently (exempted for main() entry points below)
    "TRY",      # [tryceratops] Clean exception handling: flag oversized try blocks (TRY301), useless reraise (TRY203), and redundant formatting in logger.exception (TRY401)
    "RSE",      # [flake8-raise] Remove unnecessary empty parentheses when raising exceptions: raise ValueError() -> raise ValueError (RSE102)
    "T10",      # [flake8-debugger] Catch accidentally committed breakpoint() or pdb.set_trace() calls (T100)
    # "EM",     # [flake8-errmsg] Forbid string literals inside raise ValueError("..."), forcing an extra msg = "..." line before every raise (creates visual bloat; keep disabled)
    # "LOG",    # [flake8-logging] Linting rules specific to stdlib logging (irrelevant since loguru is used exclusively)
    # "G",      # [flake8-logging-format] Forbid f-strings inside logging calls (G004) (designed for legacy stdlib lazy % formatting; directly conflicts with loguru!)

    # -------------------------------------------------------------------------
    # [Category G] Data Science, Vectorization & Performance
    # -------------------------------------------------------------------------
    "PD",       # [pandas-vet] Pandas best practices: ban inplace=True (PD002), prefer .isna() over .isnull() (PD003), prefer .to_numpy() over .values (PD011)
    "NPY",      # [NumPy-specific] NumPy modernization: ban deprecated aliases (NPY001) and legacy global np.random.seed() in favor of np.random.default_rng() (NPY002)
    "PERF",     # [Perflint] Performance anti-patterns: ban try-except inside loops (PERF203) and manual for-loop .append() patterns that should be vectorized (PERF401)
    # "DTZ",    # [flake8-datetimez] Require timezone-aware datetime objects everywhere (unnecessary overhead for local execution logs and file timestamps)

    # -------------------------------------------------------------------------
    # [Category H] Naming, Docstrings & Code Hygiene
    # -------------------------------------------------------------------------
    "N",        # [pep8-naming] PEP 8 naming conventions: CapWords for classes (N801), snake_case for functions/variables (N802/N806), UPPER_CASE for constants
    "D200",     # [pydocstyle - Single Rule] Force one-line docstrings to fit on a single line """Summary.""" rather than expanding to 3 lines (enforces §3.1 convention)
    "PGH",      # [pygrep-hooks] Ban bare # noqa (PGH004) and bare # type: ignore (PGH003) comments without specific error codes, preventing agents from silencing all checks
    "RUF",      # [Ruff-specific] Ruff native checks: flag unused # noqa comments (RUF100), identical if/else branches (RUF034), and implicit Optional type hints (RUF013)
    # "D",      # [pydocstyle - Full] Enforces multi-line NumPy/Sphinx parameter blocks (D417), which conflicts with your single-line function docstring standard
    # "DOC",    # [pydoclint] Check that multi-line docstring parameter/return sections match function signatures (unnecessary with single-line docstrings)
    # "ERA",    # [eradicate] Flag commented-out code blocks (ERA001) (prone to false positives on 7-section banners, math formulas, or reference comments)
    # "SLF",    # [flake8-self] Forbid accessing private _attr attributes outside self (SLF001) (occasionally required when tuning matplotlib/pandas internals)
    # "TD",     # [flake8-todos] Require formal author tags and issue URLs on every # TODO comment (overly bureaucratic for research repositories)
    # "FIX",    # [flake8-fixme] Fail linting whenever any # TODO or # FIXME comment is present in the file
    # "FLY",    # [flynt] Convert static "".join() calls to f-strings (already superseded by UP rules)
    # "Q",      # [flake8-quotes] Quote style checks (handled automatically by ruff format with quote-style = "double")
    # "COM",    # [flake8-commas] Trailing comma lint rules (Astral warns that COM812 conflicts directly with ruff format; keep disabled!)
    # "ISC",    # [flake8-implicit-str-concat] Implicit string concatenation checks (Astral warns that ISC001 conflicts directly with ruff format; keep disabled!)

    # -------------------------------------------------------------------------
    # [Category I] Testing, Security & Framework-Specific Rules
    # -------------------------------------------------------------------------
    "PT",       # [flake8-pytest-style] Enforce clean pytest fixture definitions and pytest.raises idioms inside test files
    # "S",      # [flake8-bandit] Security linter: flags assert statements (S101), subprocess.run calls to bioinformatics CLI tools (S603), and standard RNGs (S311)
    # "ASYNC",  # [flake8-async] Async/await best practices (uncomment when writing async network or LLM client tools)
    # "FAST",   # [FastAPI] FastAPI web framework rules (not applicable)
    # "DJ",     # [flake8-django] Django web framework rules (not applicable)
    # "AIR",    # [Airflow] Apache Airflow DAG rules (not applicable)
    # "INT",    # [flake8-gettext] Internationalization gettext translation rules (not applicable)
]

# -----------------------------------------------------------------------------
# Global Rule Exemptions (Tuned for Maximum Reviewability in Scientific Python)
# -----------------------------------------------------------------------------
ignore = [
    # Exempt ANN401 (any-type): allow typing.Any in generic decorator wrappers (*args: Any, **kwargs: Any) or dynamic serialization boundaries
    "ANN401",
    # Exempt TRY003 (raise-vanilla-args): allow inline f-strings in raise ValueError(f"Missing: {cols}") without forcing an extra variable assignment
    "TRY003",
    # Exempt N803 (invalid-argument-name): allow uppercase matrix argument names (e.g., X_train, Y_obs, W) in mathematical/statistical functions
    "N803",
    # Exempt N806 (non-lowercase-variable-in-function): allow uppercase matrix/tensor local variables (e.g., X, Y, M) inside functions
    "N806",
]

# =============================================================================
# 4. RUFF Plugin-Specific Thresholds & Detailed Explanations
# =============================================================================

[lint.mccabe]
# [What is Cyclomatic Complexity (C901)?]
# Measures the number of linearly independent execution paths through a single function.
# How it is calculated: starts at a base score of 1; increments by +1 for every if, elif,
# for, while, except, with, assert, comprehension if filter, boolean operator (and/or),
# and concrete case arm in a match statement.
# Why set to 8: allows 1–2 guard clauses plus clean core logic, while immediately failing whenever
# an AI agent writes deeply nested defensive if col in df: or try-except pyramids!
max-complexity = 8

[lint.pylint]
# [What is max-args (PLR0913)?]
# Counts the total number of parameters in a function definition (excluding self and cls).
# Set to 20: accommodates multi-parameter bioinformatics pipelines and complex visualization
# helper functions while still serving as a boundary against completely unconstrained parameter lists.
max-args = 20

# [What is max-branches (PLR0912)? — Detailed Definition of a "Branch"]
# Counts structural control-flow forks inside a single function's AST:
#   1. Every `if` block counts as +1 branch;
#   2. Every `elif` block counts as +1 branch;
#   3. Every `else` block (on if, for, while, or try) counts as +1 branch;
#   4. Every `for` or `while` loop block counts as +1 branch;
#   5. Every `except` handler and `finally` block counts as +1 branch each;
#   6. Every `case` block inside a `match` statement counts as +1 branch.
# (Unlike McCabe C901, max-branches does NOT count boolean and/or operators inside expressions).
# Why set to 10: prevents giant if-elif-else waterfalls and nudges the agent toward vectorized .map(),
# np.select(), or declarative signal tables.
max-branches = 10

# [What is max-returns (PLR0911)?]
# Counts the total number of return statements inside a single function body.
# Why set to 4: permits 1–2 early Guard Clauses at the top of the function plus the main return,
# while preventing spaghetti early returns scattered throughout the middle of a function.
max-returns = 4

# [What is max-statements (PLR0915)?]
# Counts executable AST statements inside a single function (assignments, calls, returns, loop headers;
# note that a multi-line chained .assign(...) expression counts as just 1 statement; comments/blank lines are ignored).
# Why set to 40: prevents monolithic 200-line functions and enforces modular, single-responsibility steps.
max-statements = 40

[lint.isort]
# Notice: known-first-party is omitted! [tool.ruff] src = ["workflow/src", "workflow/scripts"] handles auto-detection dynamically
# Combine multiple from mod import a as a statements from the same module into a single import block
combine-as-imports = true
# Sort all imports strictly alphabetically by module name within each section regardless of import vs from ... import
force-sort-within-sections = true

[lint.flake8-tidy-imports.banned-api]
# [Deterministic API Bans (enforced by TID251)]
# Whenever an AI agent imports or references any symbol below, Ruff fails with the exact remediation message:
"logging".msg = "Standard library 'logging' is banned. Use 'from loguru import logger' exclusively."
"os.path".msg = "Module 'os.path' is banned. Use 'from pathlib import Path' instead."
"typing.Optional".msg = "Use modern Python 3.12+ 'X | None' syntax instead of 'Optional[X]'."
"typing.Union".msg = "Use modern Python 3.12+ 'X | Y' syntax instead of 'Union[X, Y]'."
"typing.List".msg = "Use built-in generic 'list[...]' instead of 'typing.List'."
"typing.Dict".msg = "Use built-in generic 'dict[...]' instead of 'typing.Dict'."
"typing.Tuple".msg = "Use built-in generic 'tuple[...]' instead of 'typing.Tuple'."
"typing.Set".msg = "Use built-in generic 'set[...]' instead of 'typing.Set'."
