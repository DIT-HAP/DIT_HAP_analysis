channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pandas>=3.0.3
  - numpy>=2.5.0
  - biopython>=1.87
  - gffutils>=0.13
  # Floor = the version the enrichment stage was validated against (1.6.8);
  # 1.2.x imported statsmodels' removed sandbox module, so a stale env breaks
  # every FDR-BH run with ImportError.
  - goatools>=1.6.8
  - openpyxl
  - xlrd
  - loguru
  - tqdm
  - requests
  - pyyaml
  - pip
  - pyarrow
  # scipy.sparse.csgraph powers coherence/deduplicate_terms.py's redundancy graph.
  # goatools drags scipy in transitively, but that is an accident of goatools'
  # deps, not a contract — declare it directly.
  - scipy
  - pip:
    - codon-bias>=0.3.5
