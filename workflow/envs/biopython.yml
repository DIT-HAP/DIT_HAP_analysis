channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pandas>=3.0.3
  - numpy>=2.5.0
  - biopython>=1.87
  - gffutils>=0.13
  - goatools
  - openpyxl
  - xlrd
  - loguru
  - tqdm
  - requests
  - pyyaml
  - pip
  - pyarrow
  # scipy.sparse.csgraph powers coherence/deduplicate_terms.py's redundancy graph.
  # goatools drags scipy in transitively, but that is an accident of goatools'
  # deps, not a contract — declare it directly.
  - scipy
  # goatools' FDR-BH path imports multipletests from
  # statsmodels.sandbox.stats.multicomp, which statsmodels removed in 0.15.
  # Unpinned, the solver picks 0.15 and every enrichment run dies on ImportError.
  - statsmodels<0.15
  - pip:
    - codon-bias>=0.3.5
