name: cnsplots
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pandas>=2.2,<2.4
  - matplotlib>=3.10,<3.11
  - numpy>=2.4,<2.5
  - seaborn>=0.13.2,<0.14
  - pycomplexheatmap>=1.8.4,<1.9
  - statannotations>=0.7.2,<0.8
  - pyarrow
  - pytest>=9.0
  - loguru
  # Interactive HTML figures (plot_interactive_scatter.py, plot_redundancy_network.py).
  # They reuse this env rather than adding one of their own: both read the house
  # palette out of workflow/src/figures.py, so one env keeps one source of truth for
  # the colours, and none of these conflicts with the plotting stack.
  - altair>=5.4,<7
  - networkx>=3.3,<4
  - pyvis>=0.3.2,<0.4
  - pip:
    - cnsplots==0.7.0
